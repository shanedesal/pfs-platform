services:
  postgres:
    image: postgres:16-alpine
    container_name: pfs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pfs_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      # Development default: seed admin/customer + mock products on container start
      SEED_DB: ${SEED_DB:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: pfs_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./web/.env
    environment:
      # Raise V8 heap so Next's 80%-of-limit memory restart is less aggressive in Docker.
      NODE_OPTIONS: --max-old-space-size=4096
    # Webpack in Docker — see docs/docker-local-dev.md (Turbopack memory restarts).
    command: ["npm", "run", "dev", "--", "--webpack"]
    depends_on:
      - server
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres-data:
